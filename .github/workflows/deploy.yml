name: Deploy Web App and Build Android APK

on:
  push:
    branches:
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: Copy Built APK to Root
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ./AnirudhAgency.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnirudhAgency-apk
          path: ./AnirudhAgency.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ANIRUDH AGENCY Mobile App (APK)"
          body: "Direct download of ANIRUDH AGENCY Wholesale Order Entry Android app (.apk)"
          files: ./AnirudhAgency.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-apk
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: AnirudhAgency-apk
          path: '.'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
